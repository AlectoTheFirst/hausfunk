[project]
name = "hausfunk"
version = "0.1.0"
description = "AI-moderated private home radio with multiple channels"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.14",
    "pydantic-settings>=2.16",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
]

[project.scripts]
hausfunk = "hausfunk.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.0",
    "ruff>=0.17",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hausfunk"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
